<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 660px;
    height: 400px;
    overflow: hidden;
    background: #0a0a10;
  }
  html.supersample {
    zoom: 3;
  }

  .canvas {
    position: relative;
    width: 660px;
    height: 400px;
    overflow: hidden;
    background:
      radial-gradient(circle at 50% 44%, #271640 0%, #1e1033 30%, #150c26 52%, #0d0819 70%, #08050f 86%, #050308 100%);
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
  }

  /* faint ADS-B radar rings, top-left, nod to the app's purpose */
  .radar {
    position: absolute;
    left: -140px;
    top: -140px;
    width: 420px;
    height: 420px;
    border-radius: 50%;
    border: 1px solid rgba(160, 130, 220, 0.10);
  }
  .radar.r2 { left: -80px; top: -80px; width: 300px; height: 300px; border-color: rgba(160,130,220,0.14); }
  .radar.r3 { left: -20px; top: -20px; width: 180px; height: 180px; border-color: rgba(160,130,220,0.18); }

  /* subtle top sheen across the whole window, like glass */
  .sheen {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.0) 22%);
  }

  /* fine noise-less vignette, corners only, well past where the base gradient already goes dark */
  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 44%, rgba(0,0,0,0) 62%, rgba(0,0,0,0.30) 100%);
  }

  .wordmark {
    position: absolute;
    top: 26px;
    left: 32px;
    color: rgba(235, 228, 250, 0.62);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 4px;
  }
  .wordmark span {
    color: rgba(180, 140, 255, 0.85);
  }

  .tagline {
    position: absolute;
    top: 47px;
    left: 33px;
    color: rgba(200, 190, 220, 0.34);
    font-size: 9.5px;
    font-weight: 500;
    letter-spacing: 2.2px;
    text-transform: uppercase;
  }

  /* drop-zone guides (very faint, purely decorative cues under the icons) */
  .dropzone {
    position: absolute;
    top: 108px;
    width: 128px;
    height: 128px;
    border-radius: 26px;
    background: radial-gradient(circle at 50% 40%, rgba(255,255,255,0.05), rgba(255,255,255,0) 68%);
  }
  .dropzone.left { left: 116px; }
  .dropzone.right { left: 416px; }

  /* frosted glass panel sitting behind the chevrons */
  .glass-panel {
    position: absolute;
    top: 110px;
    left: 236px;
    width: 190px;
    height: 124px;
    border-radius: 28px;
    background: linear-gradient(155deg, rgba(255,255,255,0.10), rgba(255,255,255,0.02));
    border: 1px solid rgba(255,255,255,0.14);
    backdrop-filter: blur(14px) saturate(160%);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
    box-shadow:
      0 18px 40px rgba(0,0,0,0.35),
      inset 0 1px 0 rgba(255,255,255,0.18);
  }

  /* the glass arrow: three chevrons flowing left -> right */
  .arrow {
    position: absolute;
    top: 132px;
    left: 258px;
    width: 148px;
    height: 80px;
  }
  .chev {
    position: absolute;
    top: 0;
    width: 34px;
    height: 80px;
  }
  .chev svg { display: block; width: 100%; height: 100%; }
  .chev.c1 { left: 0px;  opacity: 0.38; transform: scale(0.82); }
  .chev.c2 { left: 46px; opacity: 0.68; transform: scale(0.92); }
  .chev.c3 { left: 94px; opacity: 1;    transform: scale(1.04); }

  .caption {
    position: absolute;
    top: 246px;
    left: 0;
    width: 660px;
    text-align: center;
    color: rgba(225, 218, 245, 0.5);
    font-size: 11.5px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .caption b {
    color: rgba(190, 150, 255, 0.85);
    font-weight: 700;
  }

  .hairline {
    position: absolute;
    top: 108px;
    left: 244px;
    width: 172px;
    height: 1px;
    background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.10) 50%, rgba(255,255,255,0));
  }

  /* fine grain to break up gradient banding on the dark fields */
  .grain {
    position: absolute;
    inset: 0;
    opacity: 0.05;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    background-size: 120px 120px;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="radar r1"></div>
    <div class="radar r2"></div>
    <div class="radar r3"></div>

    <div class="dropzone left"></div>
    <div class="dropzone right"></div>

    <div class="wordmark">SCOPE<span>.</span></div>
    <div class="tagline">Live ADS&#8209;B Tracking</div>

    <div class="glass-panel"></div>
    <div class="arrow">
      <div class="chev c1">
        <svg viewBox="0 0 34 80" fill="none">
          <defs>
            <linearGradient id="g1" x1="0" y1="0" x2="34" y2="80" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
              <stop offset="1" stop-color="#ffffff" stop-opacity="0.25"/>
            </linearGradient>
          </defs>
          <path d="M4 6 L28 40 L4 74" stroke="url(#g1)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="chev c2">
        <svg viewBox="0 0 34 80" fill="none">
          <defs>
            <linearGradient id="g2" x1="0" y1="0" x2="34" y2="80" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#ffffff" stop-opacity="0.98"/>
              <stop offset="1" stop-color="#d9c8ff" stop-opacity="0.35"/>
            </linearGradient>
          </defs>
          <path d="M4 6 L28 40 L4 74" stroke="url(#g2)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="chev c3">
        <svg viewBox="0 0 34 80" fill="none">
          <defs>
            <linearGradient id="g3" x1="0" y1="0" x2="34" y2="80" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
              <stop offset="1" stop-color="#c9b6ff" stop-opacity="0.55"/>
            </linearGradient>
            <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
              <feGaussianBlur stdDeviation="3.2" result="blur"/>
              <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>
          <path d="M4 6 L28 40 L4 74" stroke="url(#g3)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
        </svg>
      </div>
    </div>

    <div class="hairline"></div>
    <div class="caption">Drag <b>Scope</b> into Applications</div>

    <div class="sheen"></div>
    <div class="vignette"></div>
    <div class="grain"></div>
  </div>
<script>
  if (location.search.includes('supersample')) {
    document.documentElement.classList.add('supersample');
  }
</script>
</body>
</html>
